
name: Update Great Lakes Collector News

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collector-news-pages
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch sports news
        run: python scripts/fetch_news.py

      - name: Save updated news feed
        run: |
          if [ ! -f docs/news.json ]; then
            echo "News feed was not generated"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/news.json

          if ! git diff --cached --quiet; then
            git commit -m "Update automated sports news"
            git push
          else
            echo "No changes to commit"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload news feed
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    needs: update-news
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy news feed
        id: deployment
        uses: actions/deploy-pages@v4

